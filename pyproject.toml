[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyskins"
version = "0.1.1"
description = "Python files written in emoji that really run. Dress your code in a skin, and take it off again."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Alex and Isabela Girlea" }]
keywords = ["emoji", "fun", "skin", "theme", "christmas", "ai", "agent-skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/AlexandruGirlea/pyskins"
Repository = "https://github.com/AlexandruGirlea/pyskins"
Issues = "https://github.com/AlexandruGirlea/pyskins/issues"
Changelog = "https://github.com/AlexandruGirlea/pyskins/blob/main/CHANGELOG.md"
Demo = "https://transylvaniabytes.com/pyskins/"
"Made by" = "https://transylvaniabytes.com/"

[project.scripts]
pyskins = "pyskins.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pyskins"]

[tool.hatch.build.targets.wheel.force-include]
"pyskins.pth" = "pyskins.pth"

[tool.hatch.build.targets.sdist]
include = ["pyskins", "pyskins.pth", "tests", "examples", "assets", ".apm", "README.md", "LICENSE", "CONTRIBUTING.md", "CHANGELOG.md"]

[tool.ruff]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]
